<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>花信风</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/lxgw-wenkai-webfont@1.7.0/style.css">
<link rel="stylesheet" href="./src/ui/style.css">
<link rel="stylesheet" href="./src/ui/journal.css">
<script type="importmap">
{ "imports": { "three": "./vendor/three/build/three.module.js", "three/addons/": "./vendor/three/examples/jsm/" } }
</script>
</head>
<body>
<canvas id="view"></canvas>

<div id="hud" hidden>
  <div class="hud-tl">
    <div class="seeds"><span class="seeds-icon"></span><span id="seedCount">0</span><span class="seeds-of">/ <span id="seedTotal">0</span></span>
      <span class="compass" id="compass" title="最近的风之籽"><svg viewBox="-12 -12 24 24" width="22" height="22"><path d="M0 -9 L5 6 L0 3 L-5 6 Z" fill="currentColor"/></svg><span id="seedDist"></span></span>
    </div>
    <div class="place" id="place"></div>
  </div>
  <div class="hud-bl">
    <div class="gust"><div class="gust-fill" id="gustFill"></div></div>
    <div class="gust-label">风势</div>
    <div class="trick" id="trick" hidden><kbd>Q</kbd>凌空翻身</div>
  </div>
  <div class="hud-br"><span id="speed">0</span><small>km/h</small></div>
  <div class="hud-tr" id="job" hidden>
    <div class="job-kicker"><span class="job-icon"></span>包裹送往</div>
    <div class="job-name"><span id="jobName"></span><span class="job-spot" id="jobSpot"></span></div>
    <div class="job-meta"><span class="compass" id="jobCompass" title="包裹的去向"><svg viewBox="-12 -12 24 24" width="22" height="22"><path d="M0 -9 L5 6 L0 3 L-5 6 Z" fill="currentColor"/></svg><span id="jobDist"></span></span><span class="job-count">已送 <span id="jobCount">0</span> 单</span></div>
  </div>
  <div class="prompt" id="prompt"></div>
  <div class="card" id="card"><div class="card-kicker" id="cardKicker"></div><div class="card-name" id="cardName"></div><div class="card-sub" id="cardSub"></div></div>
  <div class="toast" id="toast"></div>
</div>

<div id="title">
  <div class="title-inner">
    <p class="kicker">一柄扫帚 · 一座岛 · 一阵好风</p>
    <h1>花信风</h1>
    <div class="bar"><div class="bar-fill" id="loadFill"></div></div>
    <p class="status" id="loadStatus">正在聚拢风势……</p>
    <button id="start" hidden>乘风而起</button>
    <div class="keys" id="keys" hidden>
      <div><kbd>W</kbd><kbd>S</kbd> 俯冲 · 爬升</div>
      <div><kbd>A</kbd><kbd>D</kbd> 侧倾转向</div>
      <div><kbd>Shift</kbd> 驭风疾行</div>
      <div><kbd>Space</kbd> 收势缓行</div>
      <div><kbd>鼠标</kbd> 转向 · <kbd>C</kbd> 视角 · <kbd>I</kbd> 反转俯仰</div>
      <div><kbd>P</kbd> 隐藏界面 · <kbd>M</kbd> 静音 · <kbd>J</kbd> 手记</div>
    </div>
  </div>
</div>

<script type="module" src="./src/main.js"></script>
</body>
</html>
